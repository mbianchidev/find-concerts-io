services:
  app:
    image: find-concerts-io:local
    build: .
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_PATH: /data/concerts.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    volumes:
      - concert-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  worker:
    image: find-concerts-io:local
    command: ['npm', 'run', 'worker']
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_PATH: /data/concerts.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    volumes:
      - concert-data:/data
    healthcheck:
      test: ['CMD', 'node', '--import', 'tsx', 'scripts/worker-health.ts']
      interval: 30s
      timeout: 10s
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  concert-data:
