name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - README.md
      - LICENSE
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm audit --audit-level=low
      - name: Lint, typecheck, and unit/integration tests
        run: npm run lint && npm run typecheck && npm test && npm run format:check
      - name: Build the hosted app
        run: npm run build
      - name: Install Chromium and WebKit
        run: npm exec playwright -- install --with-deps chromium webkit
      - name: Browser, accessibility, and bounded load tests
        run: |
          workers=$(node -p "Math.min(2, require('node:os').availableParallelism())")
          npm run test:e2e -- --workers="$workers"
      - name: Build production container without cached layers
        run: docker build --no-cache --tag find-concerts-io:ci .
      - name: Smoke-test production web and worker
        run: |
          docker run --detach --name concerts-ci --publish 127.0.0.1:3200:3000 \
            --env APP_ORIGIN=http://localhost:3200 find-concerts-io:ci
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:3200/api/v1/health/
          docker exec --detach concerts-ci npm run worker
          ready=false
          for attempt in $(seq 1 15); do
            if docker exec concerts-ci node --import tsx scripts/worker-health.ts; then
              ready=true
              break
            fi
            printf 'Waiting for worker health (%s/15)\n' "$attempt"
            sleep 1
          done
          test "$ready" = true
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker container inspect concerts-ci >/dev/null 2>&1; then
            docker logs concerts-ci
            docker rm --force concerts-ci
          fi
      - name: Browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
